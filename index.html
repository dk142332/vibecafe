<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- CSS 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- [페이지 상단] -->
    <header>
      <div class="logo">☕</div>
      <h1>바이브 카페</h1>
      <p class="subtitle">당신의 하루에 바이브를 더하다</p>
    </header>

    <!-- [탭 메뉴] -->
    <nav class="tab-menu">
      <button type="button" class="tab-btn active" id="tab-order">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tab-history">
        📋 주문 내역 <span id="order-count-badge" class="badge">0</span>
      </button>
    </nav>

    <!-- [주문하기 탭 컨텐츠] -->
    <div id="tab-content-order" class="tab-content">
      <!-- [주문서 폼] novalidate: 브라우저 기본 검증 대신 JavaScript로 유효성 검사 수행 -->
      <form id="order-form" novalidate>
      <!-- 1. 이름 (필수, text) -->
      <div class="form-group">
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required placeholder="이름을 입력하세요">
      </div>

      <!-- 2. 전화번호 (tel) -->
      <div class="form-group">
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-0000-0000">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div class="form-group">
        <label for="beverage-select">음료 선택</label>
        <select id="beverage-select" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
          <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
          <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오) - S +0원, M +500원 (기본 선택), L +1,000원 -->
      <div class="form-group">
        <span>사이즈 선택</span>
        <div>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S (+0원)</label>

          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M (+500원)</label>

          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L (+1,000원)</label>
        </div>
      </div>

      <!-- 5. 추가 옵션 (체크박스) -->
      <div class="form-group">
        <span>추가 옵션</span>
        <div>
          <input type="checkbox" id="opt-shot" name="options" value="shot" data-price="500">
          <label for="opt-shot">샷 추가 (+500원)</label>

          <input type="checkbox" id="opt-cream" name="options" value="cream" data-price="500">
          <label for="opt-cream">크림 추가 (+500원)</label>

          <input type="checkbox" id="opt-syrup" name="options" value="syrup" data-price="300">
          <label for="opt-syrup">시럽 추가 (+300원)</label>

          <input type="checkbox" id="opt-decaf" name="options" value="decaf" data-price="0">
          <label for="opt-decaf">디카페인 (+0원)</label>
        </div>
      </div>

      <!-- 6. 수량 (number, 최소 1, 최대 10, 기본값 1) -->
      <div class="form-group">
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div class="form-group">
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="3" placeholder="요청사항을 적어주세요"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div class="total-price-section">
        <p id="total-price">예상 금액: 0원</p>
      </div>

      <!-- 9 & 10. 주문하기 버튼 및 다시 작성 버튼 -->
      <div class="button-group">
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지 영역 (처음에는 숨김) -->
    <div id="order-confirmation" class="confirmation-section hidden">
      <!-- JavaScript로 주문 완료 내역이 표시될 영역 -->
    </div>
  </div>

  <!-- [주문 내역 탭 컨텐츠 (처음에는 숨김)] -->
  <div id="tab-content-history" class="tab-content hidden">
    <!-- 주문 카드들이 동적으로 들어갈 컨테이너 -->
    <div id="order-list" class="order-list-container"></div>

    <!-- 하단 요약 정보 및 전체 삭제 버튼 -->
    <div id="order-summary-section" class="order-summary-section">
      <p id="total-summary-text" class="total-summary-text">총 주문 금액: 0원 (0건)</p>
      <button type="button" id="clear-orders-btn" class="clear-orders-btn">내역 모두 지우기</button>
    </div>
  </div>
  </div>

  <!-- Supabase JS v2 라이브러리 CDN 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- JavaScript 연결 -->
  <script src="script.js"></script>
</body>
</html>
